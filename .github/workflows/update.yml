name: Update corners board

on:
  schedule:
    # Every three hours, at 17 past (00:17, 03:17 ... 21:17 UTC). This is the
    # backstop, not the main trigger: GitHub starts scheduled runs when it has
    # capacity, and here they have started 4-8 hours late or not at all (the
    # odd minute avoids the top-of-the-hour queue, which makes it worse). The
    # dependable refresh is the Mac's nightly sync at 22:30, which pushes
    # last_sync.txt and rebuilds the board within minutes.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}        # "Run workflow" button on GitHub
  push:
    paths:
      - manual_results.csv     # Flashscore results from the scheduled task
      - referees.csv           # referee appointments from the scheduled task
      - last_sync.txt          # the Mac's nightly sync, new data or not
      - checkin.txt            # our check-ins with the model (self_review.py)
      - schedule_*.csv         # the fixture list, refreshed from the Mac
      - run.py                 # a change to the model or the page rebuilds the
      - tracker/**             # board straight away, not at the next slot

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the self-review logic
        # the self-review can change predictions on its own, so its tests must
        # pass before anything is built or published
        run: python -m unittest discover tests
      - name: Build predictions and dashboard
        run: python run.py
      - name: Save results
        run: |
          git config user.name "corners-bot"
          git config user.email "corners-bot@users.noreply.github.com"
          git add data docs $(ls schedule_*.csv 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "Update $(date -u +%Y-%m-%d)"
          # someone may have pushed (e.g. Flashscore results) while this ran
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 5
          done
          exit 1
