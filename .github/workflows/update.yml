name: Update corners board

on:
  schedule:
    # 07:00 and 19:00 UTC every day. football-data uploads weekend results
    # on a weekday evening (the last one landed Mon 17:50 UTC), so the
    # evening run picks them up the same day and the morning run is a
    # safety net.
    - cron: "0 7,19 * * *"
  workflow_dispatch: {}        # "Run workflow" button on GitHub
  push:
    paths:
      - manual_results.csv     # adding Flashscore numbers triggers a refresh

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build predictions and dashboard
        run: python run.py
      - name: Save results
        run: |
          git config user.name "corners-bot"
          git config user.email "corners-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Update $(date -u +%Y-%m-%d)"
          # someone may have pushed (e.g. Flashscore results) while this ran
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 5
          done
          exit 1
