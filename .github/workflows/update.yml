name: Update corners board

on:
  schedule:
    # 07:00 UTC every day. Results usually land in the feed a day or two
    # after a round, so a daily run picks them up with no one watching.
    - cron: "0 7 * * *"
  workflow_dispatch: {}        # "Run workflow" button on GitHub
  push:
    paths:
      - manual_results.csv     # adding Flashscore numbers triggers a refresh

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build predictions and dashboard
        run: python run.py
      - name: Save results
        run: |
          git config user.name "corners-bot"
          git config user.email "corners-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update $(date -u +%Y-%m-%d)"
          git push
